[project]
name = "gpd-fpi"
version = "1.0"
description = "France Property Insight: Predicitve and analytic app for Master 2 SEP"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "geopy>=2.4.1",
    "gradio==5.49.1",
    "joblib==1.5.2",
    "matplotlib==3.10.7",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pdoc==15.0.4",
    "plotly==6.4.0",
    "pyarrow==22.0.0",
    "pydantic==2.11.10",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "sqlalchemy==2.0.44",
    "tabulate==0.9.0",
]

# depedencies not needed for users
[dependency-groups]
dev = [
    "behave==1.3.3",
    "mypy==1.18.2",
    "pandas-stubs==2.3.2.250926",
    "pip-audit==2.9.0",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "ruff==0.14.0",
    "types-requests==2.32.4.20250913",
]

[project.urls]
Homepage = "https://gpd-m2sep-france-property-insight.onrender.com/"
Documentation = "https://france-property-insight-docs.onrender.com/fpi.html"
Source = "https://gitlab-mi.univ-reims.fr/phan0005/gpd-m2sep-france-property-insight"

[tool.hatch.build.targets.wheel]
packages = ["fpi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# change line length tolerance
[tool.ruff]
line-length = 150

# default linting rules + isort
[tool.ruff.lint]
select = ["E", "F", "I"]

# ignore missing type imports
[tool.mypy]
ignore_missing_imports = true

# ignore brotli 1.1.0 issue because necessary for curent gradio version
[tool.pip_audit]
ignore = ["GHSA-2qfp-q593-8484"]

# uv run shortcuts
[project.scripts]

# run the app
oldmain = "fpi.main:old_main"
main = "fpi.main:main"
fpi = "fpi.main:main"
fpidocker = "fpi.utils.aliases:fpidocker"

# code quality
precommit = "fpi.utils.aliases:precommit"
lint = "fpi.utils.aliases:precommit"
typecheck = "fpi.utils.aliases:typecheck"
audit = "fpi.utils.aliases:audit"
# unit tests, doctests, behave tests, local CI check
test = "fpi.utils.aliases:test"
behav = "fpi.utils.aliases:run_behave"
ci = "fpi.utils.aliases:ci"
# API documentation
apidoc = "fpi.utils.aliases:apidoc"
apidocsave = "fpi.utils.aliases:apidocsave"
# dev shortcuts
exp = "fpi.analysis.explore:explore"
rep = "fpi.analysis.data_rep:report_data"
buildridge = "fpi.models.build_linear_model:mock_build_ridge"
buildlm = "fpi.models.build_linear_model:mock_build_lm"
buildrf = "fpi.models.build_random_forest:mock_build_random_forest"
predictlm = "fpi.models.build_linear_model:mock_predict_price"
predictrf = "fpi.models.predict:mock_predict_price"
validation = "fpi.data_pipeline.validation:main"
clean = "fpi.data_pipeline.clean_data:clean_data"
process = "fpi.data_pipeline.process_data:process_data"
load = "fpi.data_pipeline.loader:load_all_csv"
