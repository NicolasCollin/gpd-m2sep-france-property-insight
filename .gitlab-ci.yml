stages:
  - setup
  - lint
  - typecheck
  - audit
  - test
  - deploy

# setup dependencies once
setup:
  stage: setup
  image: python:3.13-slim
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - python -m pip install --upgrade pip
    - python -m pip install uv
    - uv sync --frozen --group dev

lint:
  stage: lint
  image: python:3.13-slim
  dependencies:
    - setup
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - uv run pre-commit run --all-files --show-diff-on-failure
  allow_failure: true

typecheck:
  stage: typecheck
  image: python:3.13-slim
  dependencies:
    - setup
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - uv run mypy fpi
  allow_failure: true

audit:
  stage: audit
  image: python:3.13-slim
  dependencies:
    - setup
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - uv run pip-audit . --ignore-vuln GHSA-2qfp-q593-8484
  allow_failure: true

test:
  stage: test
  image: python:3.13-slim
  dependencies:
    - setup
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - uv run pytest --doctest-modules --maxfail=3 --disable-warnings -q
    - uv run behave tests/behave/features

deploy:
  stage: deploy
  image: python:3.13-slim
  dependencies:
    - setup
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  script:
    - uv run python -m fpi.main --help
