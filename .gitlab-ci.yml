stages:
  - lint
  - typecheck
  - audit
  - test
  - validate
  - deploy


# template for uv installation
.ci-template:
  # image: python:3.13-slim
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
  variables:
    UV_CACHE_DIR: .uv-cache
  before_script:
  - python -m pip install --upgrade pip
  - python -m pip install uv
  - uv sync --frozen --group dev


# pre-commit hooks
lint:
  stage: lint
  extends: .ci-template
  script:
    - uv run pre-commit run --all-files --show-diff-on-failure
  allow_failure: true


# mypy static type checker
typecheck:
  stage: typecheck
  extends: .ci-template
  script:
    - uv run mypy fpi
  allow_failure: true


# look for vulnerable dependencies
audit:
  stage: audit
  extends: .ci-template
  script:
    - uv run pip-audit .
  allow_failure: true


# unit tests, doctests, and behave tests
test:
  stage: test
  extends: .ci-template
  script:
    - uv run pytest --doctest-modules --maxfail=3 --disable-warnings -q
    - uv run behave tests/behave/features


validate:dvf:
  stage: validate
  extends: .ci-template
  script:
    - mkdir -p data/processed
    - uv run python -m fpi.main validate --in data/raw/raw2021/raw_75_2021.csv --out-valid data/processed/validated.parquet --out-errors data/processed/validation_errors.csv
    - wc -l data/processed/validation_errors.csv
    - ls -lh data/processed
  artifacts:
    paths:
      - data/processed/validated.parquet
      - data/processed/validation_errors.csv
    expire_in: 1 week
  needs: ["test"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual


.validate-template:
  extends: .ci-template
  stage: validate
  script:
    - mkdir -p data/processed
    - uv run python -m fpi.main validate --in data/raw/raw2021/raw_${DEPT}_2021.csv --out-valid data/processed/validated_${DEPT}.parquet --out-errors data/processed/validation_errors_${DEPT}.csv
    - wc -l data/processed/validation_errors_${DEPT}.csv
    - ls -lh data/processed
  artifacts:
    paths:
      - data/processed/validated_${DEPT}.parquet
      - data/processed/validation_errors_${DEPT}.csv
    expire_in: 1 week
  needs: ["test"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual


validate:matrix:
  extends: .validate-template
  parallel:
    matrix:
      - DEPT: ["75","77","78","91","92","93","94","95"]


deploy:
  stage: deploy
  script:
    - echo "Deploy stage placeholder"
